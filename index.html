<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EmergentSoft — Sitio temporalmente fuera de servicio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070a;color:#edf4f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:680px;padding:40px;text-align:center}.mark{font-weight:800;letter-spacing:.08em;font-size:20px}.mark span{color:#63e6ff}.line{width:56px;height:1px;background:#63e6ff;margin:28px auto}.status{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8998a8}.wrap h1{font-size:clamp(34px,7vw,58px);line-height:1.05;letter-spacing:-.04em;margin:22px 0 16px}.wrap p{color:#8998a8;font-size:16px;line-height:1.7}.note{margin-top:32px;padding:18px 20px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.025);font-size:13px;color:#aebbc7}
</style>
</head>
<body>
<main class="wrap">
<div class="mark">EMERGENT<span>SOFT</span></div>
<div class="line"></div>
<div class="status">TEMPORARILY OFFLINE</div>
<h1>Estamos actualizando el sitio.</h1>
<p>El sitio web de EmergentSoft se encuentra temporalmente fuera de servicio mientras revisamos y reorganizamos su contenido.</p>
<div class="note">Volveremos a publicar el sitio cuando la nueva versión haya sido revisada y validada.</div>
</main>
</body>
</html>
